context:
  version: "5.8.0"

package:
  name: certbot-dns-cloudflare
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/certbot-dns-cloudflare/certbot_dns_cloudflare-${{ version }}.tar.gz
  sha256: 540870f24a7aa05d9057bfa70cb684094b4106838747e15990f498ef16b7d212

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - acme >=${{ version }}
    - certbot >=${{ version }}
    - cloudflare >=4.0

tests:
  - python:
      imports:
        - certbot_dns_cloudflare
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://certbot.eff.org
  summary: Cloudflare DNS Authenticator plugin for Certbot
  license: Apache-2.0
  license_file: LICENSE.txt
  documentation: https://certbot.eff.org
  repository: https://github.com/certbot/certbot

extra:
  recipe-maintainers:
    - pavelzw
